name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request the OIDC token
  contents: write   # lets the job commit the new image tag

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: task-api
  ROLE_ARN: arn:aws:iam::499937073132:role/github-actions-eks-platform

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update image tag in gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|\(image: .*/task-api:\).*|\1${IMAGE_TAG}|" gitops/deployment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/deployment.yml
          git diff --cached --quiet && echo "tag unchanged" && exit 0
          git commit -m "chore: deploy image ${IMAGE_TAG}"
          git pull --rebase origin main
          git push origin main